<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Voluntarios - Ornitólogos de Chile</title>
    <link rel="stylesheet" type="text/css" href="./css/styles.css">
</head>
<header>
    <nav>
        <ul>
            <li><a href="registro.html">Registro de Voluntarios</a></li>
            <li><a href="informar.html">Informar Avistamiento</a></li>
            <li><a href="listado.html">Listado de Avistamientos</a></li>
            <li><a href="indicadores.html">Indicadores y Estadísticas</a></li>
        </ul>
    </nav>
</header>
<body>
    <div class="main-container">
        <h1>Registro de usuarios - Ornitólogos de Chile</h1>
        <!-- Caja de validación  -->
        <div id="val-box" hidden>
            <h2 id="val-msg">Mensaje del sistema</h2>
            <ul id="val-list"></ul>
        </div>
        
        <!-- Formulario sin required, usando novalidate -->
        <form name="myForm" method="post" novalidate>
            <label for="nombre">Nombre Completo (*)</label>
            <input type="text" name="nombre" id="nombre"><br>

            <label for="email">Email (*)</label>
            <input type="email" name="email" id="email"><br>

            <label for="celular">Celular (Opcional)</label>
            <input type="text" name="celular" id="celular" placeholder="Ej: 987654321"><br>
            
            <label for="region">Región (*)</label>
            <select name="region" id="region">
                <option value="">Seleccione una región...</option>
            </select><br>

            <label for="comuna">Comuna (*)</label>
            <select name="comuna" id="comuna">
                <option value="">Seleccione una comuna...</option>
            </select><br>
            
            <button id="submit-btn" type="button">Registrar Voluntario</button>
        </form>
    </div>
    
    <script src="./js/select.js"></script>
    <script src="./js/validaciones.js"></script>
</body>
</html>
