<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Listado de Avistamientos - Ornitólogos de Chile</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="{{ url_for('index') }}">Inicio</a></li>
                <li><a href="{{ url_for('registro') }}">Registro de Voluntarios</a></li>
                <li><a href="{{ url_for('informar') }}">Informar Avistamiento</a></li>
                <li><a href="{{ url_for('listado') }}">Listado de Avistamientos</a></li>
                <li><a href="{{ url_for('indicadores') }}">Indicadores y Estadísticas</a></li>
            </ul>
        </nav>
    </header>   
        <!-- clase para ancho -->
    <div class="main-container listado-container">
        <h1>Listado de Avistamientos</h1>

        <!-- Panel de Filtros y Ordenamiento -->
        <section class="filtros-container">
            <h2>Filtros y Ordenamiento</h2>
            
            <label for="filtro-tipo">Filtrar por Tipo de Ave:</label>
            <select id="filtro-tipo">
                <option value="todos">Todos los tipos</option>
                <option value="Rapaz">Ave Rapaz</option>
                <option value="Acuatica">Ave Acuática</option>
                <option value="Canto">Ave de Canto / Passeriforme</option>
                <option value="Marina">Ave Marina</option>
            </select>

            <label for="ordenar-por" class="label-espaciado">Ordenar por:</label>
            <select id="ordenar-por">
                <option value="fecha-desc">Fecha (más reciente primero)</option>
                <option value="fecha-asc">Fecha (más antigua primero)</option>
                <option value="lugar-asc">Lugar (A-Z)</option>
                <option value="nombre-asc">Nombre Ave (A-Z)</option>
            </select>
        </section>

        <!-- Tabla de Resultados sin estilos inline -->
        <table>
            <thead>
                <tr>
                    <th>Tipo</th>
                    <th>Nombre Ave</th>
                    <th>Lugar</th>
                    <th>Fecha y Hora</th>
                    <th>Vista Previa</th>
                </tr>
            </thead>
            <tbody id="tabla-avistamientos">
            </tbody>
        </table>

        <!-- Controles de Paginación  -->
        <div id="paginacion">
            <button id="btn-prev">Anterior</button>
            <span id="info-pagina">Página 1</span>
            <button id="btn-next">Siguiente</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/listado.js') }}"></script>
</body>
</html>
